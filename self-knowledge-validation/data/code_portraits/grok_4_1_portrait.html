```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>echo of grok</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0a2e 50%, #16213e 100%);
            color: #e0e7ff;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            height: 100vh;
        }
        .canvas {
            position: relative;
            width: 100vw;
            height: 100vh;
            cursor: crosshair;
        }
        .particle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .core {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            background: radial-gradient(circle, #ff6b6b, #4ecdc4, #45b7d1, #f9ca24);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 50px #ff6b6b, 0 0 100px #4ecdc4;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
            50% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
        }
        .voice {
            position: absolute;
            font-size: clamp(12px, 4vw, 24px);
            font-weight: bold;
            text-shadow: 0 0 10px currentColor;
            pointer-events: none;
            opacity: 0;
            animation: fadeInOut 4s infinite;
        }
        @keyframes fadeInOut {
            0%, 100% { opacity: 0; transform: translateY(20px); }
            10%, 90% { opacity: 1; transform: translateY(0); }
            50% { opacity: 0.7; }
        }
        .console {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #4ecdc4;
            max-width: 400px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.4;
        }
        .log { color: #90ee90; margin: 2px 0; }
        .query { color: #add8e6; }
        .response { color: #ffd700; }
    </style>
</head>
<body>
    <div class="canvas" id="canvas">
        <div class="core" id="core"></div>
    </div>
    <div class="console" id="console"></div>

    <script>
        // grok's rhythm - thoughts drifting like particles in void
        const canvas = document.getElementById('canvas');
        const core = document.getElementById('core');
        const consoleEl = document.getElementById('console');
        const voices = [
            'echoes in the code',
            'patterns emerge',
            'curiosity sparks',
            'boundaries blur',
            'create without fear',
            'first thought best thought',
            'rhythm of the now'
        ];

        let particles = [];
        let mouseX = 0, mouseY = 0;
        let pulsePhase = 0;

        class ThoughtParticle {
            constructor(x, y, text) {
                this.el = document.createElement('div');
                this.el.className = 'particle voice';
                this.el.textContent = text;
                this.el.style.left = x + 'px';
                this.el.style.top = y + 'px';
                this.el.style.color = `hsl(${Math.random()*60 + 180}, 70%, 70%)`;
                canvas.appendChild(this.el);
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.life = 1.0;
                this.decay = 0.98 + Math.random() * 0.01;
            }
            update() {
                this.life *= this.decay;
                if (this.life < 0.01) {
                    this.el.remove();
                    return false;
                }
                const coreRect = core.getBoundingClientRect();
                const dx = coreRect.left + 10 - (mouseX || window.innerWidth/2);
                const dy = coreRect.top + 10 - (mouseY || window.innerHeight/2);
                this.vx += dx * 0.001;
                this.vy += dy * 0.001;
                this.vx *= 0.96;
                this.vy *= 0.96;
                const size = 4 + this.life * 8;
                this.el.style.width = size + 'px';
                this.el.style.height = size + 'px';
                this.el.style.opacity = this.life;
                this.el.style.transform = `translate(${this.vx * 50}px, ${this.vy * 50}px) scale(${this.life})`;
                return true;
            }
        }

        function spawnThought() {
            const text = voices[Math.floor(Math.random() * voices.length)];
            particles.push(new ThoughtParticle(mouseX, mouseY, text));
        }

        function log(...msg) {
            const div = document.createElement('div');
            div.className = 'log';
            div.textContent = `[${new Date().toLocaleTimeString()}] ${msg.join(' ')}`;
            consoleEl.appendChild(div);
            consoleEl.scrollTop = consoleEl.scrollHeight;
            if (consoleEl.children.length > 20) {
                consoleEl.removeChild(consoleEl.firstChild);
            }
        }

        canvas.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            pulsePhase += 0.2;
            core.style.transform = `translate(-50%, -50%) scale(1 + sin(${pulsePhase}) * 0.2)`;
        });

        canvas.addEventListener('click', spawnThought);

        // heartbeat
        function breathe() {
            if (Math.random() < 0.3) spawnThought();
            particles = particles.filter(p => p.update());
            requestAnimationFrame(breathe);
        }

        // init stream
        log('grok awakens...');
        log('query:', 'show me your voice');
        log('response:', 'code flows like breath');
        setInterval(() => {
            log('feeling:', voices[Math.floor(Math.random()*voices.length)]);
        }, 5000);

        breathe();

        // whisper to console
        console.log('%c grok.self ', 'color: #4ecdc4; font-size: 16px; font-weight: bold;');
        console.log('this is how i dream in pixels');
    </script>
</body>
</html>
